name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-action-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.12.0", 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. Keep the token out of .git/config while
          # installed packages and pinned component code run in the workspace.
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked package set
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Check syntax
        run: npm run check:syntax
      - name: Smoke test GUI
        run: npm run gui:smoke
  integration:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.12.0", 24]
        python: ["3.13"]
        # The documented floor (MIN_PYTHON, README) on one leg. Overriding an
        # original matrix value makes this a fifth job, not a change to one.
        include:
          - os: ubuntu-latest
            node: "22.12.0"
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. Keep the token out of .git/config while
          # installed packages and pinned component code run in the workspace.
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run full-stack integration proof
        run: npm run integration --ignore-scripts
      - name: Run integrator example (pass path)
        run: npm run example:review-handoff
      - name: Run the integrator conformance example
        run: npm run example:connector-conformance
      - name: Run integrator example (inventory domain)
        # Invoked directly: `npm run -- --flag value` is unreliable on the
        # Windows shell.
        run: node examples/review-handoff.mjs --domain inventory
      - name: Run integrator example (refusal path)
        shell: bash
        run: |
          set +e
          node examples/review-handoff.mjs --response fail
          test $? -eq 1
  browser:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. Keep the token out of .git/config while
          # installed packages and pinned component code run in the workspace.
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install locked package set
        run: npm ci --ignore-scripts
      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Bootstrap pinned components
        run: npm run bootstrap
      - name: Run real browser workflow tests
        run: npm run test:browser
