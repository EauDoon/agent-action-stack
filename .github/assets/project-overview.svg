    <line x1="48" y1="342" x2="1152" y2="342" stroke="#21262d" stroke-width="2"/>
    <text x="600" y="380" text-anchor="middle" font-size="14" font-weight="600" fill="#8b949e">Policy failure stops execution  •  clean settlement skips simulation unless --dispute is set</text>
