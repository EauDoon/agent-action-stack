<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description" focusable="false">
  <title id="title">Decide, act, prove</title>
  <desc id="description">One reference path across three public libraries, with fail-closed exits at every stage. The diagram shows Structured input, Decide, Act, Prove if needed.</desc>
  <metadata>Original vector artwork for the repository overview.</metadata>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="20" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#30363d" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="62" font-size="30" font-weight="750" fill="#f0f6fc">Decide, act, prove</text>
    <text x="48" y="96" font-size="18" fill="#8b949e">One reference path across three public libraries, with fail-closed exits at every stage.</text>
    <line x1="48" y1="126" x2="1152" y2="126" stroke="#21262d" stroke-width="2"/>
    <path d="M 313 236 H 320" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="48.0" y="170" width="258.0" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="48.0" y="170" width="258.0" height="5" rx="2.5" fill="#58a6ff"/>
      <text x="177.0" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#f0f6fc">Structured input</text>
      <text x="177.0" y="258" text-anchor="middle" font-size="14" fill="#8b949e">Policy-bound JSON</text>
      <circle cx="68.0" cy="190" r="4" fill="#58a6ff"/>
      <text x="288.0" y="195" text-anchor="end" font-size="12" font-weight="650" fill="#6e7681">01</text>
    </g>
<path d="M 595 236 H 602" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="330.0" y="170" width="258.0" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="330.0" y="170" width="258.0" height="5" rx="2.5" fill="#58a6ff"/>
      <text x="459.0" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#f0f6fc">Decide</text>
      <text x="459.0" y="258" text-anchor="middle" font-size="14" fill="#8b949e">Policy evaluation</text>
      <circle cx="350.0" cy="190" r="4" fill="#58a6ff"/>
      <text x="570.0" y="195" text-anchor="end" font-size="12" font-weight="650" fill="#6e7681">02</text>
    </g>
<path d="M 877 236 H 884" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="612.0" y="170" width="258.0" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="612.0" y="170" width="258.0" height="5" rx="2.5" fill="#58a6ff"/>
      <text x="741.0" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#f0f6fc">Act</text>
      <text x="741.0" y="258" text-anchor="middle" font-size="14" fill="#8b949e">Recourse + outcome check</text>
      <circle cx="632.0" cy="190" r="4" fill="#58a6ff"/>
      <text x="852.0" y="195" text-anchor="end" font-size="12" font-weight="650" fill="#6e7681">03</text>
    </g>

    <g>
      <rect x="894.0" y="170" width="258.0" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="894.0" y="170" width="258.0" height="5" rx="2.5" fill="#58a6ff"/>
      <text x="1023.0" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#f0f6fc">Prove if needed</text>
      <text x="1023.0" y="258" text-anchor="middle" font-size="14" fill="#8b949e">Evidence simulation</text>
      <circle cx="914.0" cy="190" r="4" fill="#58a6ff"/>
      <text x="1134.0" y="195" text-anchor="end" font-size="12" font-weight="650" fill="#6e7681">04</text>
